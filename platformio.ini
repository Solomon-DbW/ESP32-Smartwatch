; DIY smartwatch - step 1: NTP clock on GC9A01 round display
; Board: ESP32-S3 N16R8 (16MB flash, 8MB octal PSRAM)

[env:watch]
; Pinned: TFT_eSPI crashes on the newer Arduino core 3.x (espressif32 8.x)
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8 = QIO flash + octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DBOARD_HAS_PSRAM
    ; ---- TFT_eSPI config (replaces editing User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_BL=7
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DUSE_HSPI_PORT
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
